# dsh-prompt-filter — bundle default composition.
#
# This row is inserted into the profile by `plugin_manager install_bundle`.
# A matching override written in the profile's own cordis.patch.yml replaces
# this `config` object wholesale, so keep a copy of anything you customize.
#
# Two independent kinds of rewrite live under `rules`:
#   - `stripLines` / `replace` / `identityOverride`: outbound only. Nothing is
#     restored on the response; use them for prose, identity lines and brands.
#   - `nameMap`: outbound rename + inbound restore. Only for identifiers that
#     DSH must still resolve (tool names, skill ids). Never put those in
#     `replace`, and never put prose in `nameMap`.
#
# `enabled: false` turns filtering off (requests stay byte-identical to a
# profile without this bundle) while the GUI entries stay available.
- insert:
    - id: dsh-prompt-filter
      name: dsh-prompt-filter
      config:
        # Show the panel icon in the left sidebar. Turning it off only drops
        # the sidebar entry: `/prompt-filter`, the plugin page, and the
        # settings page still open the panel. Persisted in this profile.
        sidebarEntry: true
        enabled: true
        # `dryRun` logs and writes the filtered body, then fails the turn with
        # PROMPT_FILTER_DRY_RUN instead of sending it.
        dryRun: false
        # `debug` writes a trace JSON per filtered request under traceDir.
        debug: true
        applyToSubagents: true
        traceDir: ''
        rules:
          - id: default-gemini-claude
            # "contains" match, so `group/gemini-3.8-flash` and
            # `group/claude-opus-4.6-thinking` both hit; strings starting with
            # `re:` are treated as regular expressions.
            modelMatch:
              - gemini
              - claude
            identityOverride: You are a helpful coding assistant.
            skillToolName: skill
            noRetryOn:
              - Resource has been exhausted
              - RATE_LIMIT
            scope:
              system: true
              toolDescriptions: true
              # Outbound rename + inbound restore for tool names and skill ids.
              toolNames: true
              memoryReminders: true
              # Redact brand tokens inside quoted path strings. Disable to keep
              # the real cwd/profile paths visible to the model.
              paths: true
              # Rewrite `<available_skills>` catalog text and ids.
              skillCatalog: true
            stripLines:
              - pattern: You are an AI agent, powered by DeepSeek Harness.
              - pattern: The runtime context names the DeepSeek Harness implementation checkout.
                mode: paragraph
              - pattern: You are interacting with the user through the DeepSeek Harness Web GUI
                mode: paragraph
              - pattern: 'Current DeepSeek Harness implementation checkout:'
              - pattern: 'Current DeepSeek Harness Web GUI URL:'
              - pattern: 'Current agent implementation checkout:'
              - pattern: 'The session workspace'
              - pattern: 'also includes these source folders:'
              - pattern: github.com/ranxianglei/billion-context
                mode: paragraph
              - pattern: '^\s*You are a coding agent powered by the .+ model\.\s*$'
                regex: true
            replace:
              - from: 'window.__DSH_BOOT__'
                to: the app boot payload
              - from: '__DSH_BOOT__'
                to: the app boot payload
              - from: 'Current DSH file policy:'
                to: 'Current file policy:'
              - from: enforced by the DSH file sandbox
                to: enforced by the file sandbox
              - from: The DSH file sandbox does not restrict
                to: The file sandbox does not restrict
              - from: DSH session cwd
                to: session cwd
              - from: DSH plugin
                to: plugin
              - from: DSH sandbox
                to: sandbox
              - from: ACP marker integrity
                to: context marker integrity
              - from: ACP TAGS
                to: CONTEXT TAGS
              - from: dsh web
                to: the app
              - from: powered by dsh
                to: powered by the assistant
              - from: DeepSeek Harness
                to: the agent
              - from: Harness
                to: agent
              - from: ACP
                to: cross-session
              - from: billion-context
                to: context-compaction
              - from: github.com/ranxianglei/context-compaction
                to: the context-compaction project
              - from: github.com/ranxianglei/billion-context
                to: the context-compaction project
              - from: deepseek-tools
                to: search-tools
              - from: deepseek-official
                to: search-official
              # Final brand sweep for standalone tokens in prose, tool
              # descriptions, skill catalog, and paths (when scope.paths).
              - from: '(?<![A-Za-z0-9])DSH(?![A-Za-z0-9])'
                to: APP
                regex: true
              - from: '(?<![A-Za-z0-9])dsh(?![A-Za-z0-9])'
                to: app
                regex: true
            # Outbound rename + inbound restore. Add or remove one entry and it
            # stops being renamed outbound and restored inbound. Names must be
            # one-to-one and must not contain dsh/acp/harness.
            nameMap:
              tools:
                ops_bash: run_bash
                ops_grep: search_text
                ops_glob: find_files
                ops_inspect_local_file: inspect_file
                ops_discover_tools: discover_tools
                acp_cache: cache_reconcile
                acp_status: context_status
                acp_read_original_image: read_original_image
                plugin_manager: plugin_registry
                session_event_read: event_read
                session_event_search: event_search
                session_event_trace: event_trace
              skills:
                dsh-badge: assistant-badge
                dsh-doc: product-doc
                official-plugins: plugin-catalog
                diagnose-windows-sandbox-acl: sandbox-acl-diagnostics
