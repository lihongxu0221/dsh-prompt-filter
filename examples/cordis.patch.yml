# Example: override the bundle defaults in the profile's own cordis.patch.yml.
#
# A matching row id replaces the bundle's `config` wholesale, so copy the whole
# object you want to keep. This example filters gemini only, keeps the real
# paths visible, and shows the two rewrite classes side by side:
#   - stripLines / replace: outbound only, never restored
#   - nameMap: outbound rename + inbound restore (never put these in replace)
- id: dsh-prompt-filter
  config:
    sidebarEntry: true
    enabled: true
    dryRun: false
    debug: false
    applyToSubagents: true
    traceDir: ''
    rules:
      - id: gemini-only
        modelMatch:
          - gemini
        identityOverride: You are a helpful coding assistant.
        skillToolName: skill
        noRetryOn:
          - Resource has been exhausted
        scope:
          system: true
          toolDescriptions: true
          toolNames: true
          memoryReminders: true
          paths: false
          skillCatalog: true
        stripLines:
          - pattern: '^\s*You are an AI agent,? powered by .+\.\s*$'
            regex: true
          - pattern: 'You are interacting with the user through the .* Web GUI'
            mode: paragraph
        replace:
          - from: deepseek-tools
            to: search-tools
          - from: deepseek-official
            to: search-official
          - from: DeepSeek Harness
            to: the agent
        nameMap:
          tools:
            ops_bash: run_bash
            ops_grep: search_text
          skills:
            dsh-badge: assistant-badge
