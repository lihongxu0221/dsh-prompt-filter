name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Verify tag matches package version and source constant
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack tarball and checksums
        id: pack
        run: |
          mkdir -p dist
          packed=$(npm pack --pack-destination dist --json | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename")
          version=$(node -p "require('./package.json').version")
          cp "dist/${packed}" "dist/dsh-prompt-filter-${version}.tgz"
          rm "dist/${packed}"
          cp "dist/dsh-prompt-filter-${version}.tgz" dist/dsh-prompt-filter.tgz
          (cd dist && sha256sum dsh-prompt-filter.tgz "dsh-prompt-filter-${version}.tgz" > SHA256SUMS)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (optional)
        if: env.NODE_AUTH_TOKEN != ''
        continue-on-error: true
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/dsh-prompt-filter.tgz
            dist/dsh-prompt-filter-${{ steps.pack.outputs.version }}.tgz
            dist/SHA256SUMS

      - name: Upload packaged plugin as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-prompt-filter-${{ steps.pack.outputs.version }}
          path: dist/*
